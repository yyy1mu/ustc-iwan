[package]
name = "iwan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "iwan-client"
path = "src/bin/client/main.rs"

[[bin]]
name = "iwan-server"
path = "src/bin/server/main.rs"

[[bin]]
name = "iwan-client-oidc"
path = "src/bin/oidc/main.rs"

[dependencies]
libc = "0.2"
md-5 = "0.10"
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3.4"
ureq = { version = "2", features = ["json"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }

[profile.release]
opt-level = 2
