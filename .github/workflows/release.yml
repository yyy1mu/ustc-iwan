name: Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── iwan-client ──────────────────────────────
          - { binary: iwan-client, target: x86_64-unknown-linux-gnu,   suffix: x86_64-gnu }
          - { binary: iwan-client, target: x86_64-unknown-linux-musl,  suffix: x86_64-musl }
          - { binary: iwan-client, target: aarch64-unknown-linux-gnu,  suffix: aarch64-gnu }
          - { binary: iwan-client, target: aarch64-unknown-linux-musl, suffix: aarch64-musl }
          - { binary: iwan-client, target: armv7-unknown-linux-gnueabihf, suffix: armv7-gnu }
          - { binary: iwan-client, target: armv7-unknown-linux-musleabihf, suffix: armv7-musl }
          - { binary: iwan-client, target: riscv64gc-unknown-linux-musl, suffix: riscv64-musl }
          # ── iwan-client-oidc ───────────────────────
          - { binary: iwan-client-oidc, target: x86_64-unknown-linux-gnu,   suffix: x86_64-gnu }
          - { binary: iwan-client-oidc, target: x86_64-unknown-linux-musl,  suffix: x86_64-musl }
          - { binary: iwan-client-oidc, target: aarch64-unknown-linux-gnu,  suffix: aarch64-gnu }
          - { binary: iwan-client-oidc, target: aarch64-unknown-linux-musl, suffix: aarch64-musl }
          - { binary: iwan-client-oidc, target: armv7-unknown-linux-gnueabihf, suffix: armv7-gnu }
          - { binary: iwan-client-oidc, target: armv7-unknown-linux-musleabihf, suffix: armv7-musl }
          - { binary: iwan-client-oidc, target: riscv64gc-unknown-linux-musl, suffix: riscv64-musl }
          # ── iwan-server ──────────────────────────
          - { binary: iwan-server, target: x86_64-unknown-linux-gnu,   suffix: x86_64-gnu }
          - { binary: iwan-server, target: x86_64-unknown-linux-musl,  suffix: x86_64-musl }
          - { binary: iwan-server, target: aarch64-unknown-linux-gnu,  suffix: aarch64-gnu }
          - { binary: iwan-server, target: aarch64-unknown-linux-musl, suffix: aarch64-musl }
          - { binary: iwan-server, target: armv7-unknown-linux-gnueabihf, suffix: armv7-gnu }
          - { binary: iwan-server, target: armv7-unknown-linux-musleabihf, suffix: armv7-musl }
          - { binary: iwan-server, target: riscv64gc-unknown-linux-musl, suffix: riscv64-musl }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build ${{ matrix.binary }} (${{ matrix.target }})
        run: |
          # x86_64/aarch64 gnu → pin glibc 2.17; others → let zig pick
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu)
              TARG="${{ matrix.target }}.2.17" ;;
            *)
              TARG="${{ matrix.target }}" ;;
          esac
          cargo zigbuild --bin "${{ matrix.binary }}" --target "$TARG" --release
          mkdir -p "$GITHUB_WORKSPACE/release"
          dest="$GITHUB_WORKSPACE/release/${{ matrix.binary }}-${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dest"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ matrix.suffix }}
          path: release/${{ matrix.binary }}-${{ matrix.suffix }}

  build-desktop:
    name: Build ${{ matrix.binary }} for ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS links Rust dependencies statically. Apple system libraries remain dynamic.
          - { binary: iwan-client, runner: macos-15-intel, target: x86_64-apple-darwin, platform: macos, arch: x86_64, extension: '' }
          - { binary: iwan-client-oidc, runner: macos-15-intel, target: x86_64-apple-darwin, platform: macos, arch: x86_64, extension: '' }
          - { binary: iwan-client, runner: macos-15, target: aarch64-apple-darwin, platform: macos, arch: aarch64, extension: '' }
          - { binary: iwan-client-oidc, runner: macos-15, target: aarch64-apple-darwin, platform: macos, arch: aarch64, extension: '' }

          # MSVC builds use a statically linked C runtime.
          - { binary: iwan-client, runner: windows-2025, target: x86_64-pc-windows-msvc, platform: windows, arch: x86_64, extension: '.exe' }
          - { binary: iwan-client-oidc, runner: windows-2025, target: x86_64-pc-windows-msvc, platform: windows, arch: x86_64, extension: '.exe' }
          - { binary: iwan-client, runner: windows-11-arm, target: aarch64-pc-windows-msvc, platform: windows, arch: aarch64, extension: '.exe' }
          - { binary: iwan-client-oidc, runner: windows-11-arm, target: aarch64-pc-windows-msvc, platform: windows, arch: aarch64, extension: '.exe' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS binary
        if: matrix.platform == 'macos'
        env:
          RUSTFLAGS: -C strip=symbols
        run: |
          cargo build --locked --release --bin "${{ matrix.binary }}" --target "${{ matrix.target }}"
          mkdir -p release
          output="${{ matrix.binary }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.extension }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}${{ matrix.extension }}" "release/$output"
          file "release/$output"
          otool -L "release/$output"

      - name: Build Windows binary with static CRT
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C strip=symbols
        run: |
          cargo build --locked --release --bin "${{ matrix.binary }}" --target "${{ matrix.target }}"
          New-Item -ItemType Directory -Force release | Out-Null
          $output = "${{ matrix.binary }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.extension }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}${{ matrix.extension }}" "release/$output"
          $dependencies = (dumpbin /dependents "release/$output" | Out-String)
          $dependencies
          if ($dependencies -match '(?i)VCRUNTIME|MSVCP|ucrtbase') {
            throw "Windows C runtime was linked dynamically"
          }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/${{ matrix.binary }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.extension }}

  release:
    needs: [build, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Zip each binary individually
        run: |
          cd release
          for dir in */; do
            name="${dir%/}"
            file=$(find "$dir" -type f | head -1)
            zip -j "${name}.zip" "$file"
          done
          find . -maxdepth 1 -type d ! -name . -exec rm -rf {} +
          ls -la

      - name: Delete existing release (if any)
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
